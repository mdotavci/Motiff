name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # Same as pressing Run in Xcode: signing stays on, no team set.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Motiff.xcodeproj \
            -scheme Motiff \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install and launch
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Motiff.app
          test -d "$APP/PlugIns/MotiffShare.appex"
          echo "Share Extension embedded"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.mdotavci.motiff
          sleep 10
          xcrun simctl io "$UDID" screenshot launch.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.mdotavci.motiff
          echo "App is running after 10s"
          # The app creates Media/ and Incoming/ in the App Group container on launch,
          # then seeds 12 placeholder References into Media/ on first run.
          GROUP=$(xcrun simctl get_app_container "$UDID" com.mdotavci.motiff group.com.mdotavci.motiff)
          echo "App Group container: $GROUP"
          ls "$GROUP"
          test -d "$GROUP/Media" && test -d "$GROUP/Incoming"
          echo "App Group connected"
          COUNT=$(find "$GROUP/Media" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Seeded media files: $COUNT"
          [ "$COUNT" -ge 12 ]
          echo "Seed data present"

      # One simulator screenshot per route. Add routes here as screens arrive.
      - name: Snapshots
        run: |
          .claude/skills/run-motiff/snapshot-ios.sh "$UDID" snapshots \
            canvases \
            "canvas:Product photography look" \
            "canvas:Product photography look|view=map" \
            "canvas:Product photography look|view=map|select=Light" \
            "canvas:Product photography look|select=Light|detail" \
            "canvas:Product photography look|select=Light|inspector" \
            "canvas:Product photography look|view=graph" \
            boards \
            "canvas:Product photography look|bisect=content" \
            "canvas:Product photography look|bisect=legend" \
            "canvas:Product photography look|bisect=pickers" \
            "canvas:Product photography look|bisect=keys" \
            "canvas:Product photography look|bisect=overlays" \
            "canvas:Product photography look|bisect=panels" \
            "canvas:Product photography look|bisect=chrome" \
            "canvas:Product photography look|bisect=observers" \
            "canvas:Product photography look|bisect=values" \
            "canvas:Product photography look|bisect=pickers,keys,overlays,panels,chrome,observers,values"

      # Pushed to ci-snapshots/<branch>-ios, next to the Mac ones.
      - name: Publish snapshots
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A snapshots 2>/dev/null)" ]; then echo "No snapshots"; exit 0; fi
          BRANCH="ci-snapshots/$GITHUB_REF_NAME-ios"
          cp launch.png snapshots/ 2>/dev/null || true
          cd snapshots
          printf 'Run %s\nCommit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > RUN.txt
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "iOS snapshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: |
            launch.png
            build.log
            snapshots/
          if-no-files-found: ignore

  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Same as pressing Run in Xcode: signing stays on, no team set.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Motiff.xcodeproj \
            -scheme MotiffMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            | tee build-mac.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-mac.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Motiff.xcodeproj \
            -scheme MotiffTests \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            | tee test-mac.log | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test-mac.log

      - name: Launch
        run: |
          APP=build/Build/Products/Debug/Motiff.app
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q app-sandbox
          echo "Sandboxed"
          open "$APP"
          sleep 12
          screencapture -x launch-mac.png || true
          pgrep -x Motiff
          echo "App is running after 12s"
          # The app creates Media/ and Incoming/ in its sandbox container on launch,
          # then seeds 12 placeholder References into Media/ on first run.
          LIB="$HOME/Library/Containers/com.mdotavci.motiff/Data/Library/Application Support/Motiff"
          ls "$LIB"
          test -d "$LIB/Media" && test -d "$LIB/Incoming"
          echo "Library folders created"
          COUNT=$(find "$LIB/Media" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Seeded media files: $COUNT"
          [ "$COUNT" -ge 12 ]
          echo "Seed data present"
          # The example Canvas: 13 nodes, 1 link, 4 categories.
          STORE="$HOME/Library/Containers/com.mdotavci.motiff/Data/Library/Application Support/default.store"
          CANVASES=$(sqlite3 "$STORE" "SELECT COUNT(*) FROM ZCANVAS")
          NODES=$(sqlite3 "$STORE" "SELECT COUNT(*) FROM ZCANVASNODE")
          LINKS=$(sqlite3 "$STORE" "SELECT COUNT(*) FROM ZCANVASLINK")
          CATEGORIES=$(sqlite3 "$STORE" "SELECT COUNT(*) FROM ZCANVASCATEGORY")
          echo "Canvases: $CANVASES, nodes: $NODES, links: $LINKS, categories: $CATEGORIES"
          [ "$CANVASES" -ge 1 ] && [ "$NODES" -ge 13 ] && [ "$LINKS" -ge 1 ] && [ "$CATEGORIES" -ge 4 ]
          echo "Example canvas present"

      # One window snapshot per route. Add routes here as screens arrive.
      - name: Snapshots
        run: |
          .claude/skills/run-motiff/snapshot-mac.sh build/Build/Products/Debug/Motiff.app snapshots \
            library \
            "canvas:Product photography look" \
            "canvas:Product photography look|select=Light|inspector" \
            "canvas:Product photography look|select=Light|detail" \
            "canvas:Product photography look|select=Write a three-line|detail" \
            "canvas:Product photography look|select=Light|paste=matte ceramic mug on linen, hard window light --ar 4:5" \
            "canvas:Product photography look|filter=Composition" \
            "canvas:Product photography look|select=Light|view=outline" \
            "canvas:Product photography look|view=graph" \
            canvasgraph \
            "canvas:Product photography look|find=light" \
            "canvas:500 nodes|stress" \
            "canvas:Product photography look|drawer" \
            boards \
            "board:Product photography" \
            "library|shortcuts"

      # Pushed to ci-snapshots/<branch> so agents can `git fetch` them; pushes made with
      # GITHUB_TOKEN don't trigger workflows.
      - name: Publish snapshots
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A snapshots 2>/dev/null)" ]; then echo "No snapshots"; exit 0; fi
          BRANCH="ci-snapshots/$GITHUB_REF_NAME"
          cd snapshots
          printf 'Run %s\nCommit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > RUN.txt
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Snapshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            launch-mac.png
            build-mac.log
            test-mac.log
            snapshots/
          if-no-files-found: ignore
