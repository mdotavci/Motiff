name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # Same as pressing Run in Xcode: signing stays on, no team set.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Motiff.xcodeproj \
            -scheme Motiff \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install and launch
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Motiff.app
          test -d "$APP/PlugIns/MotiffShare.appex"
          echo "Share Extension embedded"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.mdotavci.motiff
          sleep 10
          xcrun simctl io "$UDID" screenshot launch.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.mdotavci.motiff
          echo "App is running after 10s"
          # The app creates Media/ and Incoming/ in the App Group container on launch,
          # then seeds 12 placeholder References into Media/ on first run.
          GROUP=$(xcrun simctl get_app_container "$UDID" com.mdotavci.motiff group.com.mdotavci.motiff)
          echo "App Group container: $GROUP"
          ls "$GROUP"
          test -d "$GROUP/Media" && test -d "$GROUP/Incoming"
          echo "App Group connected"
          COUNT=$(find "$GROUP/Media" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Seeded media files: $COUNT"
          [ "$COUNT" -ge 12 ]
          echo "Seed data present"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: |
            launch.png
            build.log
          if-no-files-found: ignore

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Same as pressing Run in Xcode: signing stays on, no team set.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Motiff.xcodeproj \
            -scheme MotiffMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            | tee build-mac.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-mac.log

      - name: Launch
        run: |
          APP=build/Build/Products/Debug/Motiff.app
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q app-sandbox
          echo "Sandboxed"
          open "$APP"
          sleep 12
          screencapture -x launch-mac.png || true
          pgrep -x Motiff
          echo "App is running after 12s"
          # The app creates Media/ and Incoming/ in its sandbox container on launch,
          # then seeds 12 placeholder References into Media/ on first run.
          LIB="$HOME/Library/Containers/com.mdotavci.motiff/Data/Library/Application Support/Motiff"
          ls "$LIB"
          test -d "$LIB/Media" && test -d "$LIB/Incoming"
          echo "Library folders created"
          COUNT=$(find "$LIB/Media" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Seeded media files: $COUNT"
          [ "$COUNT" -ge 12 ]
          echo "Seed data present"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            launch-mac.png
            build-mac.log
          if-no-files-found: ignore
