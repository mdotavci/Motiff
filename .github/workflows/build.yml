name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # Same as pressing Run in Xcode: signing stays on, no team set.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Motiff.xcodeproj \
            -scheme Motiff \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Install and launch
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Motiff.app
          test -d "$APP/PlugIns/MotiffShare.appex" && echo "Share Extension embedded"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q group.com.mdotavci.motiff \
            && echo "App Group entitlement signed in"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --stdout="$PWD/launch.log" --stderr="$PWD/launch.log" "$UDID" com.mdotavci.motiff
          sleep 8
          xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.mdotavci.motiff \
            && echo "App is running after 8s"
          cat launch.log
          grep -q "App Group connected" launch.log
          xcrun simctl io "$UDID" screenshot launch.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: |
            launch.png
            build.log
          if-no-files-found: ignore
